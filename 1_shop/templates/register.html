{% extends "base.html" %}
{% block content %}
<h1>Register</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <p><input name="email" type="email" placeholder="Email" required></p>
  <p><input name="password" type="password" placeholder="Password" required></p>
  <button type="submit">Register</button>
</form>
{% endblock %}
